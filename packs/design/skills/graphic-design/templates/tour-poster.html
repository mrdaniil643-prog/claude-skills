<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Tour poster</title>
<!-- Data-driven tour / concert poster in three formats from one file.
     Edit TOUR below, drop in the assets, then render:
       node render.cjs tour-poster.html print.pdf --mm 420x594 --bleed 3 --query format=a2
       node render.cjs tour-poster.html post.png  --size 1080x1350 --query format=post
       node render.cjs tour-poster.html story.png --size 1080x1920 --query format=story
     Assets (all optional): title.png — artist name from text3d.cjs (--bg transparent) or
     letterforms.py SVG; photo.png — artist photo through phototreat.py (cut-out works best);
     ornament.svg — ornaments.py; qr.svg — assets.py qr. Check: check.cjs --kind poster|cover. -->
<link rel="stylesheet" href="fonts/fonts.css">
<script>
window.__pending = true;   // render.cjs waits until the layout has fitted itself
const TOUR = {
  title: "title.png",                 // image of the artist name (or null to use text below)
  titleText: "АРТИСТ",
  subtitle: "ТУР 2026",
  photo: "photo.png",                 // treated photo, transparent cut-out ideal
  photoCutout: false,                 // false: photo has a background → edges dissolve
  ornament: "ornament.svg",
  qr: "qr.svg",
  qrLabel: "билеты",
  age: "16+",
  dates: [
    ["14.11", "Москва", "VK Stadium"],
    ["16.11", "Санкт-Петербург", "А2"],
    ["21.11", "Казань", "Pyramida"],
    ["23.11", "Екатеринбург", "Tele-Club"],
    ["28.11", "Новосибирск", "Подземка"],
    ["30.11", "Краснодар", "Arena Hall"],
  ],
  footer: "организатор · промо · партнёр",
};
</script>
<style>
  :root { --bg: #070707; --ink: #f2f2f2; --accent: #ff2a2a; --muted: rgba(242,242,242,.6);
          --display: "Unbounded", sans-serif; --text: "Manrope", sans-serif;
          --trim-w: 420mm; --trim-h: 594mm; --bleed: 0mm; }
  html, body { margin: 0; background: var(--bg); }
  .p { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--text); }
  /* sizes per format; every measure below is in "u" = 1/100 of the poster width */
  .a2    { width: calc(var(--trim-w) + 2 * var(--bleed)); height: calc(var(--trim-h) + 2 * var(--bleed)); --u: calc((var(--trim-w) + 2 * var(--bleed)) / 100); --safe: calc(var(--bleed) + 12mm); }
  .post  { width: 1080px; height: 1350px; --u: 10.8px; --safe: 56px; }
  .story { width: 1080px; height: 1920px; --u: 10.8px; --safe: 64px; }

  .photo { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 78%; max-width: 110%; object-fit: contain; z-index: 1; }
  /* a photo with its background (not a cut-out) dissolves into the poster instead of a hard box */
  .photo.soft { -webkit-mask-image: radial-gradient(ellipse 52% 60% at 50% 52%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 52% 60% at 50% 52%, #000 55%, transparent 100%); }
  .orn { position: absolute; left: 50%; top: 18%; width: 92%; transform: translateX(-50%); opacity: .9; z-index: 0; }
  /* scrim keeps dates readable over the photo */
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; z-index: 2; background: linear-gradient(transparent, color-mix(in oklab, var(--bg) 85%, transparent) 45%, var(--bg)); }
  .glow { position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 40%, color-mix(in oklab, var(--accent) 35%, transparent), transparent 70%); z-index: 0; }
  .grain { position: absolute; inset: 0; z-index: 5;  /* under the text and QR: noise on a QR breaks scanning */ mix-blend-mode: overlay; opacity: .28; pointer-events: none; }

  .top { position: absolute; left: var(--safe); right: var(--safe); top: var(--safe); z-index: 3; display: flex; justify-content: space-between;
         font: 700 calc(2.4 * var(--u)) / 1 var(--text); letter-spacing: .18em; text-transform: uppercase; }
  .title { position: absolute; left: var(--safe); right: var(--safe); top: calc(var(--safe) + 5 * var(--u)); z-index: 4; text-align: center; }
  .title img { width: 100%; max-height: calc(34 * var(--u)); object-fit: contain; }
  .title .txt { font: 900 calc(15 * var(--u)) / .9 var(--display); letter-spacing: -.02em; }
  .bottom { position: absolute; left: var(--safe); right: var(--safe); bottom: var(--safe); z-index: 6; display: grid; grid-template-columns: 1fr auto; gap: calc(3 * var(--u)); align-items: end; }
  .dates { min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: calc(2.2 * var(--u)); row-gap: calc(.7 * var(--u));
           font: 800 calc(3.3 * var(--u)) / 1.05 var(--display); text-transform: uppercase; }
  .dates.two { grid-template-columns: auto 1fr auto 1fr; }
  .dates .d { color: var(--accent); font-variant-numeric: tabular-nums; }
  .dates .v { display: block; font: 600 calc(1.6 * var(--u)) / 1.2 var(--text); color: var(--muted); text-transform: none; letter-spacing: 0; }
  .side { position: relative; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: calc(1 * var(--u)); }
  .qr { width: calc(16 * var(--u)); background: #f2f2f2; padding: calc(.8 * var(--u)); border-radius: calc(.8 * var(--u)); }
  .qr img { width: 100%; display: block; }
  .qrl { font: 800 calc(1.8 * var(--u)) / 1 var(--text); letter-spacing: .2em; text-transform: uppercase; }
  .age { position: absolute; right: var(--safe); top: calc(var(--safe) + 0 * var(--u)); z-index: 4; }
  .foot { grid-column: 1 / -1; font: 600 calc(1.4 * var(--u)) / 1 var(--text); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

  /* story: everything between the top profile bar (~12 %) and the bottom reply/caption
     band (~20 %), nothing in the right-hand button column; QR moves left */
  .story .top { top: 250px; font-size: calc(3.4 * var(--u)); }
  .story .title { top: 320px; }
  .story .bottom { bottom: 400px; right: 160px; grid-template-columns: 1fr; }
  .story .side { flex-direction: row; align-items: center; justify-content: flex-start; gap: calc(2 * var(--u)); }
  .story .dates { font-size: calc(3.8 * var(--u)); }
  .story .scrim { height: 66%; background: linear-gradient(transparent, color-mix(in oklab, var(--bg) 88%, transparent) 30%, var(--bg) 70%); }
  .story .qr { width: calc(17 * var(--u)); }
  /* post: tighter title, photo smaller */
  .post .photo { height: 70%; }
  .post .dates { font-size: calc(2.9 * var(--u)); }

  .guides { display: none; position: absolute; inset: 0; z-index: 99; pointer-events: none; }
  .show-guides .guides { display: block; }
  .guides i { position: absolute; inset: var(--safe); outline: 2px dashed #ff00a8; }
</style>
</head>
<body>
<div class="p" id="p">
  <div class="glow"></div>
  <img class="orn" id="orn" alt="">
  <img class="photo" id="photo" alt="">
  <div class="scrim"></div>
  <div class="top"><span id="sub"></span><span id="age"></span></div>
  <div class="title" id="title"></div>
  <div class="bottom">
    <div class="dates" id="dates"></div>
    <div class="side" id="side"></div>
    <div class="foot" id="foot"></div>
  </div>
  <svg class="grain" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="guides"><i></i></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const fmt = q.get('format') || 'post';
const p = document.getElementById('p');
p.classList.add(fmt);
if (q.has('guides')) document.body.classList.add('show-guides');
const T = TOUR;
const set = (id, v) => { document.getElementById(id).textContent = v || ''; };
set('sub', T.subtitle); set('age', T.age); set('foot', T.footer);
const img = (id, src) => { const el = document.getElementById(id); if (src) el.src = src; else el.remove(); };
img('photo', T.photo); img('orn', T.ornament);
document.getElementById('title').innerHTML = T.title ? `<img src="${T.title}" alt="">` : `<div class="txt">${T.titleText}</div>`;
const d = document.getElementById('dates');
if (T.dates.length > 6 && fmt !== 'story') d.classList.add('two');
d.innerHTML = T.dates.map(([date, city, venue]) => `<span class="d">${date}</span><span>${city}<span class="v">${venue || ''}</span></span>`).join('');
document.getElementById('side').innerHTML = T.qr ? `<div class="qr"><img src="${T.qr}"></div><div class="qrl">${T.qrLabel || ''}</div>` : '';
// A photo with its own background dissolves at the edges (file:// pixels can't be read,
// so this is declared in TOUR rather than detected).
const ph = document.getElementById('photo');
if (ph && !T.photoCutout) ph.classList.add('soft');
// Shrink the dates until every row fits (long city names, many dates).
document.fonts.ready.then(() => {
  const box = d.getBoundingClientRect(), side = document.getElementById('side').getBoundingClientRect();
  let fs = parseFloat(getComputedStyle(d).fontSize);
  const beside = side.width && side.left > box.left + 10 && side.top < box.bottom;   // QR to the right, not below
  const over = () => [...d.children].some((el) => { const r = el.getBoundingClientRect(); return (beside && r.right > side.left - 8) || r.right > box.right + 1; });
  for (let i = 0; i < 30 && over(); i++) { fs *= 0.95; d.style.fontSize = fs + 'px'; }
  window.__pending = false;
});
// missing optional images should not leave broken icons
document.querySelectorAll('img').forEach((im) => im.addEventListener('error', () => im.remove()));
</script>
</body>
</html>
